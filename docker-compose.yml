services:
  jira-fe:
    image: phamtanhoang/jira-fe:latest
    container_name: jira-fe
    restart: unless-stopped
    # Next.js standalone reads HOSTNAME to decide which interface to bind.
    # Without this, alpine sets HOSTNAME=<container-id> → Next resolves that
    # to the container's docker-network IP and binds ONLY there, leaving
    # 127.0.0.1 unbound. Healthcheck (and any in-container probe) then fails
    # with "Connection refused" against localhost.
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "3030:3000"
    # Hard memory cap. Next.js standalone runner is modest — 200MB is
    # plenty for SSR + rewrite proxy at this scale. Tighter than BE because
    # FE has no Prisma client / no in-memory cache.
    mem_limit: 200m
    memswap_limit: 350m
    # Liveness probe — Next.js standalone server responds 200 on `/`. We
    # don't depend on the BE being up here (pages render even when API
    # rewrite target is down).
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://localhost:3000/ > /dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
