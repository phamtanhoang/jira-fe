  #       with:
  #         node-version: "20"
  #         cache: "npm"
  #     - run: npm ci
  #     - name: Cache Playwright browsers
  #       uses: actions/cache@v4
  #       id: playwright-cache
  #       with:
  #         path: ~/.cache/ms-playwright
  #         key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
  #     - if: steps.playwright-cache.outputs.cache-hit != 'true'
  #       run: npx playwright install chromium --with-deps
  #     - if: steps.playwright-cache.outputs.cache-hit == 'true'
  #       run: npx playwright install-deps chromium
  #     - run: npm run build
  #     - run: npm run e2e
  #     - if: failure()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 7

  # ─────────── Job 3: Build Docker image (only on push to main) ───────────
  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────── Job 4: SSH deploy to server ───────────
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/jira/jira-fe
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            docker compose up -d --force-recreate
            docker image prune -f

      - name: Verify deployment (smoke check)
        run: |
          echo "Waiting for FE to be ready..."
          sleep 20
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://jira.3hteam.io.vn/sign-in)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Smoke check passed (attempt $i, status $STATUS)"
              exit 0
            fi
            echo "Attempt $i/6 — got status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Smoke check failed after 80s — FE not responding 200 on /sign-in"
          exit 1

  # ─────────── Job 5: Consolidated Telegram notification ───────────
  notify:
    name: Notify Telegram
    needs: [test, build, deploy]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "stage=success" >> $GITHUB_OUTPUT
            echo "icon=✅" >> $GITHUB_OUTPUT
            echo "title=Frontend Deploy Success" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "stage=test" >> $GITHUB_OUTPUT
            echo "icon=🛑" >> $GITHUB_OUTPUT
            echo "title=Deploy BLOCKED — Lint/Type/Unit test failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "stage=build" >> $GITHUB_OUTPUT
            echo "icon=❌" >> $GITHUB_OUTPUT
            echo "title=Docker Build Failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "stage=deploy" >> $GITHUB_OUTPUT
            echo "icon=❌" >> $GITHUB_OUTPUT
            echo "title=Deploy Failed" >> $GITHUB_OUTPUT
          else
            echo "stage=skipped" >> $GITHUB_OUTPUT
          fi

      # HTML format is used instead of Markdown because raw commit messages
      # often contain unbalanced `_` `*` `[` `(` that break Markdown parsing
      # mid-message ("can't find end of the entity" error from Telegram).
      # HTML only requires escaping `< > &`, which commit messages rarely have.
      - name: Prepare Telegram message
        id: prepare-telegram-message
        run: |
          python - <<'PY'
          import html, os

          icon = os.getenv('STAGE_ICON', '')
          title = os.getenv('STAGE_TITLE', '')
          repo = os.getenv('GITHUB_REPOSITORY', '')
          branch = os.getenv('GITHUB_REF_NAME', '')
          commit = os.getenv('GITHUB_SHA', '')
          author = os.getenv('GITHUB_ACTOR', '')
          message = os.getenv('GITHUB_EVENT_HEAD_COMMIT_MESSAGE', '')
          server_url = os.getenv('GITHUB_SERVER_URL', '')
          run_id = os.getenv('GITHUB_RUN_ID', '')

          escaped_message = html.escape(message, quote=False)
          payload = f"""{icon} <b>{html.escape(title)}</b>

          <b>Repo:</b> <code>{html.escape(repo)}</code>
          <b>Branch:</b> <code>{html.escape(branch)}</code>
          <b>Commit:</b> <code>{html.escape(commit)}</code>
          <b>Author:</b> {html.escape(author)}
          <b>Message:</b> <code>{escaped_message}</code>

          <a href=\"{html.escape(server_url)}/{html.escape(repo)}/actions/runs/{html.escape(run_id)}\">View Action</a>"""
          print('telegram_message<<EOF')
          print(payload)
          print('EOF')
          PY
        env:
          STAGE_ICON: ${{ steps.status.outputs.icon }}
          STAGE_TITLE: ${{ steps.status.outputs.title }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Send Telegram notification
        if: steps.status.outputs.stage != 'skipped'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: ${{ steps.prepare-telegram-message.outputs.telegram_message }}
