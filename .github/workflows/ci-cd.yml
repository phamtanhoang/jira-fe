name: CI/CD Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/jira-fe

jobs:
  # ─────────── Job 1: Fast feedback (lint, types, unit tests) ───────────
  test:
    name: Lint, Type-check, Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run Jest unit tests
        run: npm run test:run

  # ─────────── Job 2: E2E Tests (TEMPORARILY DISABLED — too slow) ───────────
  # To re-enable: uncomment the block below AND change `build.needs: test` to `build.needs: e2e-test`
  # Files kept: playwright.config.ts, tests/e2e/*.spec.ts — run locally with `npm run e2e`
